name: reader_app
description: "An offline Flutter reader app for EPUB and local documents."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_riverpod: 3.4.2
  go_router: 18.0.0
  file_picker: 12.1.3
  path_provider: 2.1.5
  path: 1.9.1
  sqflite: 2.3.3+1
  shared_preferences: 2.3.3
  archive: 3.6.1
  xml: 6.6.1
  html: 0.15.6
  uuid: 4.6.0
  flutter_tts: 4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.svg
